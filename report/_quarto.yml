project:
  type: book
  output-dir: _site

book:
  title: "Apache Ossie 調査レポート"
  subtitle: "仕様と実装のあいだで何が起きているか"
  author: "dobachi"
  date: "2026-07-19"
  description: "Apache Ossie（旧 Open Semantic Interchange）を一次情報と動作確認で調べた記録"
  site-url: "https://dobachi.github.io/ossie-playground/"
  repo-url: "https://github.com/dobachi/ossie-playground"
  search: true
  page-navigation: true
  back-to-top-navigation: true
  # サイドバー右上に PDF のダウンロードリンクを出す
  downloads: [pdf]
  output-file: "apache-ossie-report"

  chapters:
    - index.qmd
    - chapters/01-situation.qmd
    - chapters/02-what-is-ossie.qmd
    - chapters/03-specification.qmd
    - chapters/04-governance.qmd
    - chapters/05-ecosystem.qmd
    - chapters/06-verification.qmd
    - chapters/07-assessment.qmd

  appendices:
    - appendix/method.qmd
    - appendix/reproduce.qmd
    - appendix/resources.qmd

  page-footer:
    left: "調査日 2026-07-19"
    right: "[ossie-playground](https://github.com/dobachi/ossie-playground)"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc: true
    toc-depth: 3
    toc-title: 目次
    code-copy: true
    code-overflow: wrap
    lang: ja
    fig-align: center
    link-external-newwindow: true
    link-external-icon: true
    number-sections: true

  # PDF は lualatex + luatexja で組む。日本語フォントは Noto CJK に固定してあり、
  # CI 側で fonts-noto-cjk を入れておく必要がある（.github/workflows/publish.yml）。
  pdf:
    documentclass: scrreprt
    classoption: [11pt]
    pdf-engine: lualatex
    lang: ja
    mainfont: "Noto Serif CJK JP"
    sansfont: "Noto Sans CJK JP"
    monofont: "Noto Sans Mono CJK JP"
    CJKmainfont: "Noto Serif CJK JP"
    CJKsansfont: "Noto Sans CJK JP"
    CJKmonofont: "Noto Sans Mono CJK JP"
    CJKoptions:
      - BoldFont=Noto Sans CJK JP Bold
    geometry:
      - top=25mm
      - bottom=25mm
      - left=22mm
      - right=22mm
    toc: true
    toc-depth: 3
    toc-title: 目次
    number-sections: true
    colorlinks: true
    code-overflow: wrap
    fig-align: center
    fig-pos: "htbp"
    include-in-header:
      text: |
        % 図が本文幅・ページ高さを超えないよう、全ての画像に上限を付ける。
        % 画像に実寸が指定されると \setkeys{Gin} の既定値では効かないため、
        % \includegraphics 自体を包んでいる。
        \usepackage[export]{adjustbox}
        \let\origincludegraphics\includegraphics
        \renewcommand{\includegraphics}[2][]{%
          \origincludegraphics[#1,max width=\linewidth,max totalheight=0.85\textheight,keepaspectratio]{#2}}
