name: Publish report

# report/ 配下の Quarto ブックを HTML と PDF の両方でビルドし、gh-pages ブランチへ公開する。
# .qmd は純粋な Markdown（コード実行なし）で、図は生成済み PNG を同梱しているため、
# Python/R ランタイムは要らない。ただし PDF は lualatex + luatexja で組むので、
# TeX（TinyTeX）と日本語フォント（Noto CJK）が要る。

on:
  push:
    branches: [main]
    paths:
      - 'report/**'
      - 'VERSION'
      - 'scripts/set-version.sh'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # PDF のファイル名・表紙・フッタに入る版は VERSION が正。ここがずれたまま
      # 公開すると、ファイル名と中身の版が食い違った PDF が出回るので先に止める。
      - name: Check report version
        run: scripts/set-version.sh --check

      # _quarto.yml で Noto CJK を名指ししているため、無いと PDF の日本語が消える
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # 足りないパッケージは Quarto が描画中に自動で入れるが、
      # 主要なものを先に入れて再試行の回数を減らす（名前違いは無視して先へ進む）
      - name: Install LaTeX packages
        run: |
          tlmgr update --self || true
          for pkg in luatexja adjustbox koma-script fontspec unicode-math geometry \
                     caption float booktabs framed fancyvrb microtype parskip xurl \
                     bookmark footnotehyper mdwtools subcaption tcolorbox environ \
                     trimspaces pdfcol fontawesome5 upquote; do
            tlmgr install "$pkg" || echo "skip: $pkg"
          done

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
