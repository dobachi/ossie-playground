name: Publish report

# report/ 配下の Quarto ブックをビルドし、gh-pages ブランチへ公開する。
# .qmd は純粋な Markdown（コード実行なし）で、図は生成済み PNG を同梱しているため、
# CI には Quarto のみが必要（Python/R ランタイムは不要）。

on:
  push:
    branches: [main]
    paths:
      - 'report/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
